<!doctype html>
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>報名查詢系統</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:
  "Noto Sans TC",
  sans-serif;
}

.wrap{
  width:100%;
  max-width:480px;
  margin:auto;
  padding:20px;
}

.title{
  text-align:center;
  color:#7CFC00;
  font-size:32px;
  margin:30px 0;
  font-weight:bold;
}

input{
  width:100%;
  height:64px;
  padding:0 20px;
  background:#000;
  border:2px solid #00ff66;
  border-radius:10px;
  color:#fff;
  font-size:28px;
  outline:none;
}

input::placeholder{
  color:#888;
}

.btns{
  display:flex;
  gap:12px;
  margin-top:18px;
}

button{
  flex:1;
  height:60px;
  border:none;
  border-radius:10px;
  background:#7CFC00;
  color:#000;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.card{
  margin-top:25px;
  border:2px solid #00ff66;
  border-radius:12px;
  padding:20px;
  min-height:280px;
}

.line{
  margin-bottom:18px;
  font-size:24px;
  word-break:break-all;
}

.msg{
  margin-top:20px;
  color:#7CFC00;
  font-size:22px;
}

.error{
  color:#ff4444;
}

</style>

</head>

<body>

<div class="wrap">

  <div class="title">
    報名查詢系統
  </div>

  <input
    type="number"
    id="number"
    placeholder="輸入分機查詢"
    enterkeyhint="done"
  >

  <div class="btns">

    <button onclick="searchData()">
      查詢
    </button>

    <button onclick="resetForm()">
      修正
    </button>

    <button onclick="checkin()">
      確認報到
    </button>

  </div>

  <div class="card">

    <div class="line" id="showSerial">
      查詢序號：
    </div>

    <div class="line" id="showNumber">
      編號：
    </div>

    <div class="line" id="showName">
      姓名：
    </div>

    <div class="line" id="showGroup">
      組別：
    </div>

    <div class="line" id="showStatus">
      狀態：
    </div>

    <div class="msg" id="msg"></div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
