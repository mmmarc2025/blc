<style>
:root{
  --max:1280px;
  --safeX:24px;

  --topbarY:10px;

  --contentTop:110px;
  --contentShiftY:3vh;

  --panelBaseH:60vh;
  --panelExtraH:5vh;

  --panelMinRatio:0.42;
  --panelMaxRatio:0.50;

  --inkBottomOverlap:92px;
  --navOffsetY:1.1;
  --navPageShift:8vh;

  --btnW:210px;
  --btnH:64px;
  --btnGap:18px;

  /* 功能列比例 */
  --titleW:60vw;
  --titleH:18vh;
  --actionW:8vw;

  /* ✅ 下一頁左移比例 */
  --nextShiftX:4vw;

  --gold:#f5d36a;
  --dark:#2b1c0f;
}

/* Reset */
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:"Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  background:#000;
  overflow:hidden;
}

.stage{
  position:relative;
  width:100%;
  height:100vh;
}

/* ===== 背景 ===== */
.bg-layer{
  position:absolute;
  inset:0;
  z-index:1;
}
.bg-layer .bg{
  position:absolute;
  inset:0;
  background:url("./images/page_bg01_02.jpg") top center / cover no-repeat;
}

/* ===== 白色內容區 ===== */
.content-layer{
  position:absolute;
  top:calc(var(--contentTop) + var(--contentShiftY));
  left:50%;
  transform:translateX(-50%) scaleX(1.1);
  width:min(var(--max), calc(100% - var(--safeX)*2));
  z-index:2;
}

.content-panel{
  position:relative;
  height:calc(var(--panelBaseH) + var(--panelExtraH));
  background-color:transparent;
  border-radius:16px;
  box-shadow:0 18px 38px rgba(0,0,0,.25);
  overflow: visible;
}

.content-scroll{
  height:100%;
  overflow:auto;
  padding:30px 34px 40px;
  color:var(--dark);
  line-height:1.8;
  text-align: center; 
}

/* ===== UI 層 ===== */
.ui-layer{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}

/* ===== 上方功能列 ===== */
.topbar{
  position:absolute;
  top:var(--topbarY);
  left:50%;
  transform:translateX(-50%);
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:auto;
}

/* Logo */
.logo{
  position:absolute;
  left:var(--safeX);
  width:10px;
  height:56px;
}

/* Title */
.title-wrap{
  width:var(--titleW);
  height:var(--titleH);
  background:url("./images/page_uptitlebg2-20.png") center/contain no-repeat;
  position:relative;
}
.title-text{
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;      /* 垂直置中 */
  justify-content: center; /* 水平靠左 */
  font-size: clamp(18px, 2.4vw, 32px);
  letter-spacing: .08em;
  color: #fff;
}

/* ===== 右側功能按鈕（分開底圖，皆往左內縮 10%） ===== */
.actions{
  position:absolute;
  right:5%;
  display:flex;
  gap:1vw;
}

.action-btn{
  width:var(--actionW);
  height:var(--titleH);
  position:relative;
  text-decoration:none;
  pointer-events:auto;
}

.action-btn span{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:14px;
  letter-spacing:.12em;
}
.actions2{
  position:absolute;
  left:15%;
  display:flex;
  gap:1vw;
}

.action2-btn{
  width:var(--actionW);
  height:var(--titleH);
  position:relative;
  text-decoration:none;
  pointer-events:auto;
}

.action-btn2 span{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:14px;
  letter-spacing:.12em;
} 
	
/* 回首頁（往左 10%） */
.action2-btn.home{
  background:url("./images/page_upbtn_01.png") center/contain no-repeat;
  transform: translateX(calc(-1 * var(--nextShiftX)));
}

/* 下一頁（往左 10%） */
.action-btn.next{
  background:url("./images/page_upbtn_02.png") center/contain no-repeat;
  transform: translateX(calc(-1 * var(--nextShiftX)));
}
/* ===== 水墨 ===== */
.ink{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:38vh;
  background:url("./images/index_ink.png") center bottom / cover no-repeat;
  pointer-events:none;
  animation: inkBreath 6s ease-in-out infinite;
}

/* ===== 九按鈕 ===== */
.nav-panel{
  position:absolute;
  left:50%;
  bottom:calc(var(--inkBottomOverlap) * var(--navOffsetY) - var(--navPageShift));
  transform:translateX(-50%);
  width:min(var(--max), calc(100% - var(--safeX)*2));
  pointer-events:auto;
}

.nav-grid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:var(--btnGap);
}

    /* ===== 按鈕：使用 PNG 底圖（可反向色） ===== */
    .nav-btn{
      width: var(--btnW);
      height: var(--btnH);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 0 16px;
      border-radius: 10px;

      /* 這裡改成 PNG 底圖 */
      background: none;
      background-image: url("./images/index_footer_bg1.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain; /* 文字顏色：亮底用深色字 */
      color:#fff3da;
      font-weight: 400;
      letter-spacing: .08em;
      text-decoration:none;
      cursor:pointer;
		text-decoration:none;     /* 明確移除底線 */
		

      position:relative;
      transform: translateZ(0);
      will-change: transform;
      overflow:hidden;

      /* 陰影（可視需要調強） */
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.24));
      user-select:none;

    }
	.nav-btn:link,
.nav-btn:visited,
.nav-btn:hover,
.nav-btn:active{
  text-decoration:none;     /* 保險：所有狀態都沒底線 */
}


.nav-btn.is-invert{
  /* 背景照用你指定的版本 */
  background-image: url("./images/index_footer_bg2.png");

  /* ❗只控制文字顏色 */
  color: #ffffff; /* 或你要的反向文字色 */
}
	.nav-btn.is-invert:hover{
  transform: translateY(-2px) scale(1.02);
}

      /* 光澤掃過（維持原本效果） */
    .nav-btn::after{
      content:"";
      position:absolute;
      inset:-40%;
      background: linear-gradient(120deg,
        transparent 35%,
        rgba(255,255,255,.55) 48%,
        transparent 60%);
      transform: translateX(-60%) rotate(12deg);
      opacity:0;
      transition: opacity .25s ease;
      pointer-events:none;
    }
    .nav-btn:hover::after{
      opacity:1;
      animation: shine 1.1s ease;
    }
    @keyframes shine{
      from{ transform: translateX(-70%) rotate(12deg); }
      to{ transform: translateX(70%) rotate(12deg); }
    }

    .nav-btn:hover{
      transform: translateY(-2px) scale(1.02);
      /* hover 亮一點 */
      filter: brightness(1.06) drop-shadow(0 16px 26px rgba(0,0,0,.28));
    }
    .nav-btn:active{
      transform: translateY(0) scale(0.99);
    }

    /* ===== RWD ===== */
    @media (max-width: 900px){
      :root{ --btnW: 180px; --btnH: 60px; --btnGap: 14px; }
      .brand{ top:10%; }
      .brand .tiny{ font-size:13px; }
    }
    @media (max-width: 560px){
      :root{ --btnW: 46vw; --btnH: 58px; --btnGap: 12px; }
      .brand .tiny{ font-size:12px; }
    }
	
	/* ===== 燈箱 ===== */
/* ===== Gallery Grid（固定一行 6 張，不放大） ===== */
.gallery{
  display: grid;
  grid-template-columns: repeat(6, 1fr); /* 固定 6 張 */
  gap: 16px;
  margin: 20px auto 32px;
}

/* 單張項目 */
.gallery__item{
  border-radius: 12px;
  overflow: hidden;
  background: rgba(0,0,0,.06);
  cursor: pointer;
}

/* 縮圖本體 */
.gallery__item img{
  width: 100%;
  aspect-ratio: 4 / 3;   /* 統一比例，避免跳動 */
  object-fit: cover;
  display: block;
}


/* ===== Lightbox Gallery ===== */
.lb-gallery{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.lb-gallery img{
  max-width:100%;
  max-height:calc(90vh - 140px);
  border-radius:12px;
}

/* 左右切換按鈕 */
.lb-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:56px;
  height:56px;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
}

.lb-nav.prev{ left:16px; }
.lb-nav.next{ right:16px; }

.lb-nav:active{ transform:translateY(-50%) scale(.96); }

/* 張數顯示 */
.lb-counter{
  position:absolute;
  bottom:18px;
  right:22px;
  color:#fff;
  font-size:14px;
  letter-spacing:.12em;
  opacity:.85;
}

/* ===== Universal Touch Lightbox ===== */
.lightbox{
  position: fixed;
  inset: 0;
  z-index: 999999;              /* 永遠最上層 */
  display: none;
  align-items: center;
  justify-content: center;
  padding: clamp(12px, 2vw, 24px);
}
.lightbox.is-open{ display:flex; }

.lightbox__backdrop{
  position:absolute;
  inset:0;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(6px);
}

.lightbox__panel{
  position: relative;
  width: min(1200px, 94vw);
  max-height: 90vh;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(15,15,15,.86);
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 30px 70px rgba(0,0,0,.45);
  z-index: 1;
}

.lightbox__content{
  width:100%;
  padding: 18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 圖片自適應 */
.lightbox__content img{
  max-width: 100%;
  max-height: calc(90vh - 120px); /* 留給關閉按鈕 */
  width:auto;
  height:auto;
  border-radius: 12px;
  display:block;
}

/* HTML5 影片自適應 */
.lightbox__content video{
  width: min(1100px, 94vw);
  max-height: calc(90vh - 120px);
  border-radius: 12px;
  background:#000;
}

/* iframe 影片（YouTube/Vimeo）16:9 */
.lightbox__iframe{
  width: min(1100px, 94vw);
  aspect-ratio: 16/9;
  border-radius: 12px;
  overflow:hidden;
  background:#000;
}
.lightbox__iframe iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

/* 觸控友善的關閉按鈕 */
.lightbox__close{
  position:absolute;
  top: 12px;
  right: 12px;
  height: 56px;
  min-width: 120px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.35);
  background: rgba(0,0,0,.45);
  color:#fff;
  cursor:pointer;
  z-index: 2;

  display:flex;
  align-items:center;
  justify-content:center;
  gap: 10px;

  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.lightbox__close span:first-child{ font-size: 22px; line-height: 1; }
.lightbox__closeText{ font-size: 15px; letter-spacing: .12em; }

body.is-lock{ overflow:hidden; }
	/* ===== 燈箱 ===== */
</style>
</head>

	<!-- ✅ YouTube player warm-up（不顯示、不影響版面） -->
<div id="yt-preload" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;">
  <iframe
    src="https://www.youtube-nocookie.com/embed/KnPzXYsPy4E?playsinline=1&rel=0&modestbranding=1"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"

<script>
(() => {
  // =========================================================
  // State + Elements
  // =========================================================
  let galleryImages = []; // 這裡放「大圖」URL 清單
  let currentIndex = 0;

  const lb = document.getElementById('lightbox');
  const content = document.getElementById('lightboxContent');

  if (!lb || !content) {
    console.warn('[Lightbox] Missing #lightbox or #lightboxContent');
    return;
  }

  // =========================================================
  // Utils
  // =========================================================
  const isImageFile = (url) => /\.(png|jpg|jpeg|webp|gif|svg)(\?.*)?$/i.test(url || '');
  const isVideoFile = (url) => /\.(mp4|webm|ogg)(\?.*)?$/i.test(url || '');
  const isYouTubeEmbed = (url) => /youtube(-nocookie)?\.com\/embed\//i.test(url || '');

  const safeOrigin = () => {
    try {
      const o = window.location.origin;
      return (o && o !== 'null') ? encodeURIComponent(o) : '';
    } catch {
      return '';
    }
  };

  // 你目前用 nocookie；若要改成 youtube.com，把網域換掉即可
  const buildYouTubeEmbedById = (id) => {
    const origin = safeOrigin();
    const originQS = origin ? `&origin=${origin}` : '';
    return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1&modestbranding=1${originQS}`;
  };

  const buildYouTubeWatchUrl = (id) =>
    `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;

  // =========================================================
  // Lightbox Core
  // =========================================================
  const open = (html) => {
    content.innerHTML = html;
    lb.classList.add('is-open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.classList.add('is-lock');
  };

  const close = () => {
    lb.classList.remove('is-open');
    lb.setAttribute('aria-hidden', 'true');
    content.innerHTML = ''; // stop video/iframe immediately
    document.body.classList.remove('is-lock');
  };

  // =========================================================
  // Gallery Lightbox (Swipeable)
  // =========================================================
  const renderGallery = () => {
    const src = galleryImages[currentIndex];

    content.innerHTML = `
      <div class="lb-gallery">
        <button class="lb-nav prev" type="button" aria-label="上一張">‹</button>
        <img src="${src}" alt="" decoding="async">
        <button class="lb-nav next" type="button" aria-label="下一張">›</button>
        <div class="lb-counter">${currentIndex + 1} / ${galleryImages.length}</div>
      </div>
    `;

    // ✅ 預載下一張（只預載 1 張，省資源但更順）
    if (galleryImages.length > 1) {
      const nextIndex = (currentIndex + 1) % galleryImages.length;
      const pre = new Image();
      pre.decoding = 'async';
      pre.src = galleryImages[nextIndex];
    }
  };

  const openGallery = (index) => {
    if (!galleryImages.length) {
      console.warn('[Gallery] No images loaded (galleryImages is empty).');
      return;
    }
    currentIndex = Math.max(0, Math.min(index, galleryImages.length - 1));
    renderGallery();
    lb.classList.add('is-open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.classList.add('is-lock');
  };

  const prev = () => {
    if (!galleryImages.length) return;
    currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
    renderGallery();
  };

  const next = () => {
    if (!galleryImages.length) return;
    currentIndex = (currentIndex + 1) % galleryImages.length;
    renderGallery();
  };

  // =========================================================
  // YouTube Lightbox + Fallback
  // =========================================================
  const renderYouTubeFallback = (id) => `
    <div style="text-align:center;color:#fff;">
      <p style="font-size:18px;letter-spacing:.08em;margin:0 0 10px;">影片無法嵌入播放</p>
      <a href="${buildYouTubeWatchUrl(id)}" target="_blank" rel="noopener noreferrer"
         style="display:inline-flex;margin-top:6px;
         padding:14px 28px;border-radius:999px;
         border:1px solid rgba(255,255,255,.4);
         background:rgba(255,255,255,.15);
         color:#fff;text-decoration:none;">
        改用 YouTube 開啟
      </a>
    </div>
  `;

  const openYouTubeWithFallback = (id) => {
    const embedUrl = buildYouTubeEmbedById(id);

    // ✅ 先插 iframe（不先給 src），下一個 tick 才塞 src（部分 WebView 較穩）
    open(`
      <div class="lightbox__iframe">
        <iframe id="lbYT"
          src=""
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    `);

    const iframe = document.getElementById('lbYT');
    let loaded = false;

    setTimeout(() => { iframe.src = embedUrl; }, 0);

    // If blocked / slow, show fallback button after timeout
    const timer = setTimeout(() => {
      if (!loaded && lb.classList.contains('is-open')) {
        content.innerHTML = renderYouTubeFallback(id);
      }
    }, 2500);

    iframe.addEventListener('load', () => {
      loaded = true;
      clearTimeout(timer);
    });
  };

  // =========================================================
  // Load Gallery JSON (Ultra low-resource: small thumbs + full images)
  // 支援兩種 JSON：
  // A) 舊格式（你目前的 p5.json）:
  //    { "basePath":"./", "images":["001.jpg","002.jpg"...] }
  //    → 縮圖=大圖（仍有 IO 懶載入，只是不省流量）
  //
  // B) 新格式（推薦）:
  //    { "thumbPath":"./thumbs/", "fullPath":"./",
  //      "images":[{"t":"001.jpg","f":"001.jpg"}, ...] }
  // =========================================================
  const galleries = Array.from(document.querySelectorAll('.gallery[data-gallery-index]'));
  const makeURL = (path, base) => new URL(path, base).toString();

  // ✅ 真懶載入：img 先不給 src，只放 data-src；進入視窗附近才開始下載
  const io = ('IntersectionObserver' in window)
    ? new IntersectionObserver((entries) => {
        entries.forEach((ent) => {
          if (!ent.isIntersecting) return;
          const img = ent.target;
          const realSrc = img.dataset.src;
          if (realSrc && !img.getAttribute('src')) img.setAttribute('src', realSrc);
          io.unobserve(img);
        });
      }, { root: null, rootMargin: '300px 0px', threshold: 0.01 })
    : null;

  galleries.forEach((galleryEl) => {
    const indexUrl = galleryEl.dataset.galleryIndex;
    if (!indexUrl) return;

    fetch(indexUrl, { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error(`Fetch gallery index failed (${res.status})`);
        return res.json();
      })
      .then((data) => {
        const indexBase = new URL(indexUrl, location.href);

        // New format base
        const thumbBase = new URL((data.thumbPath ?? ''), indexBase);
        const fullBase  = new URL((data.fullPath  ?? ''), indexBase);

        // Old format base
        const oldBase = new URL((data.basePath ?? ''), indexBase);

        let items = [];

        if (Array.isArray(data.images) && data.images.length && typeof data.images[0] === 'object') {
          // New format: [{t,f}]
          items = data.images.map((it) => ({
            thumb: makeURL(it.t, thumbBase),
            full:  makeURL(it.f, fullBase),
          }));
        } else {
          // Old format: ["001.jpg"...]
          const arr = Array.isArray(data.images) ? data.images : [];
          items = arr.map((name) => ({
            // 沒有 thumbPath 時，thumb 就用同一路徑（仍有 IO 懶載入）
            thumb: makeURL(name, data.thumbPath ? thumbBase : oldBase),
            full:  makeURL(name, oldBase),
          }));
        }

        // 大圖清單給燈箱用
        galleryEl.__imgs = items.map((it) => it.full);

        // 先塞縮圖 DOM，但不立刻下載（只放 data-src）
        galleryEl.innerHTML = items.map((it, i) => `
          <div class="gallery__item">
            <img
              data-index="${i}"
              data-src="${it.thumb}"
              alt=""
              loading="lazy"
              decoding="async"
            >
          </div>
        `).join('');

        const imgs = Array.from(galleryEl.querySelectorAll('img[data-src]'));
        if (io) imgs.forEach((img) => io.observe(img));
        else imgs.forEach((img) => { img.src = img.dataset.src; }); // fallback
      })
      .catch((err) => {
        console.error('[Gallery] Load failed:', err);
        galleryEl.innerHTML = `
          <div style="padding:10px;color:#fff;background:rgba(120,0,0,.35);border-radius:10px;">
            相簿載入失敗：${err.message}
          </div>
        `;
      });
  });

  // =========================================================
  // Events
  // =========================================================
  document.addEventListener('click', (e) => {
    // 1) Gallery thumbnail click
    const gImg = e.target.closest('.gallery img[data-index]');
    if (gImg) {
      const galleryEl = gImg.closest('.gallery');
      galleryImages = (galleryEl && galleryEl.__imgs) ? galleryEl.__imgs : [];
      openGallery(parseInt(gImg.dataset.index, 10));
      return;
    }

    // 2) Generic lightbox trigger (YouTube thumbnail etc.)
    const t = e.target.closest('[data-lightbox]');
    if (!t) return;

    e.preventDefault();

    // YouTube by ID
    if (t.dataset.youtubeId) {
      openYouTubeWithFallback(t.dataset.youtubeId);
      return;
    }

    // data-src > href > src
    const src = t.dataset.src || t.getAttribute('href') || t.getAttribute('src');
    if (!src) return;

    if (isImageFile(src)) {
      galleryImages = [src];
      openGallery(0);
      return;
    }

    if (isVideoFile(src)) {
      open(`
        <video controls autoplay playsinline>
          <source src="${src}">
          您的瀏覽器不支援影片播放。
        </video>
      `);
      return;
    }

    // YouTube embed URL
    if (isYouTubeEmbed(src)) {
      const m = src.match(/embed\/([a-zA-Z0-9_-]{6,})/);
      if (m && m[1]) openYouTubeWithFallback(m[1]);
      return;
    }
  });

  // Prev/Next buttons
  content.addEventListener('click', (e) => {
    if (e.target.classList.contains('prev')) prev();
    if (e.target.classList.contains('next')) next();
  });

  // Swipe
  let startX = 0;
  content.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
  }, { passive: true });

  content.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) dx > 0 ? prev() : next();
  }, { passive: true });

  // Close
  lb.addEventListener('click', (e) => {
    if (e.target.matches('[data-lb-close]')) close();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lb.classList.contains('is-open')) close();
  });

  // Optional: expose close for other scripts
  window.__closeLightbox = close;
})();


// =========================================================
// 拉桿（保留你原本的 resize-handle）
// =========================================================
(() => {
  const panel = document.querySelector('.content-panel');
  const handle = document.querySelector('.resize-handle');
  if (!panel || !handle) return;

  const rootStyle = getComputedStyle(document.documentElement);
  const minRatio = parseFloat(rootStyle.getPropertyValue('--panelMinRatio')) || 0.4;
  const maxRatio = parseFloat(rootStyle.getPropertyValue('--panelMaxRatio')) || 0.75;

  let startY = 0;
  let startH = 0;
  let hitMin = false;
  let hitMax = false;

  const vh = () => window.innerHeight;
  const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

  const vibrate = () => {
    if (navigator.vibrate) navigator.vibrate(50); // 50ms 輕震
  };

  const onMove = (clientY) => {
    const delta = clientY - startY;
    const newPx = startH + delta;

    const minPx = vh() * minRatio;
    const maxPx = vh() * maxRatio;

    const clamped = clamp(newPx, minPx, maxPx);
    panel.style.height = clamped + 'px';

    if (newPx <= minPx) {
      if (!hitMin) { vibrate(); hitMin = true; }
    } else {
      hitMin = false;
    }

    if (newPx >= maxPx) {
      if (!hitMax) { vibrate(); hitMax = true; }
    } else {
      hitMax = false;
    }
  };

  const onStart = (e) => {
    e.preventDefault();
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    startH = panel.getBoundingClientRect().height;
    hitMin = hitMax = false;

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onTouchMove, { passive: false });
    document.addEventListener('touchend', onEnd);
  };

  const onMouseMove = (e) => onMove(e.clientY);
  const onTouchMove = (e) => { e.preventDefault(); onMove(e.touches[0].clientY); };

  const onEnd = () => {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onTouchMove);
    document.removeEventListener('touchend', onEnd);
  };

  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, { passive: false });
})();
</script>
