<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff8df">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ALL IN ZOO 數位闖關護照</title>
<!-- V8：調整為完成四關中的任兩關即可領獎，並更新關卡密碼 -->
<style>
:root{--page-w:853;--page-h:1844}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;background:#eee7d1;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
body{display:flex;justify-content:center;min-height:100vh}
.app{
  position:relative;width:min(100vw,853px);aspect-ratio:853/1844;
  background:#fff;overflow:hidden;box-shadow:0 0 28px rgba(0,0,0,.16)
}
.bg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
  display:block;user-select:none;-webkit-user-drag:none
}
.hot-input{
  position:absolute;z-index:5;border:0;background:rgba(255,255,255,.04);
  outline:none;text-align:center;font-weight:900;color:#65451e;
  font-size:max(16px,3.4vw);letter-spacing:.08em;padding:0 4px;border-radius:12px;
  -webkit-appearance:none;appearance:none
}
.hot-input:disabled{
  opacity:1;-webkit-text-fill-color:#3d7d3f;color:#3d7d3f;
  background:rgba(255,255,255,.08)
}
.hot-btn{
  position:absolute;z-index:6;border:0;background:transparent;cursor:pointer;
  border-radius:16px;-webkit-tap-highlight-color:transparent;padding:0
}
.hot-btn:active{background:rgba(255,255,255,.24);transform:scale(.98)}
.stamp{
  position:absolute;z-index:7;pointer-events:none;object-fit:contain;
  aspect-ratio:1;transform:translate(-50%,-50%) scale(0) rotate(-22deg);opacity:0;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.12))
}
.stamp.show{animation:stampIn .65s cubic-bezier(.18,1.55,.32,1) forwards}
@keyframes stampIn{
  0%{opacity:0;transform:translate(-50%,-140%) scale(1.55) rotate(-28deg)}
  58%{opacity:1;transform:translate(-50%,-45%) scale(.94) rotate(-8deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}
}
.reward-panel{
  position:absolute;
  left:13%;
  top:79.15%;
  width:78.2%;
  height:9.25%;
  z-index:9;
  border-radius:24px;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:1.2% 3%;
  pointer-events:none;
}
.reward-title{
  min-height:1.5em;
  color:#e66e19;
  font-size:clamp(21px,5.4vw,42px);
  line-height:1.15;
  font-weight:1000;
  letter-spacing:.02em;
}
.reward-title.master{
  color:#3d833f;
}
.reward-note{
  margin-top:.55em;
  color:#6f6558;
  font-size:clamp(11px,2.65vw,21px);
  line-height:1.35;
  font-weight:700;
}
.reward-panel.ready .reward-title{
  animation:pulse 1s ease-in-out infinite alternate;
}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.045)}}
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(30px);background:rgba(41,65,37,.95);
  color:#fff;padding:12px 17px;border-radius:999px;font-weight:800;
  opacity:0;transition:.22s;z-index:50;max-width:88vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.error-screen{
  position:absolute;inset:0;z-index:100;background:#fff9e8;padding:30px;
  display:none;align-items:center;justify-content:center;text-align:center;color:#6f4b24
}
.error-screen.show{display:flex}
canvas{position:fixed;inset:0;pointer-events:none;z-index:40}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="app" id="app">
  <img class="bg" id="background" src="0711c-bg.png?v=20260614e" alt="ALL IN ZOO 數位闖關護照">

  <input class="hot-input" data-i="0" type="password" inputmode="numeric" maxlength="8"
    style="left:6.5%;top:45.72%;width:24.8%;height:2.5%" aria-label="第一關通關密碼">
  <button class="hot-btn" data-i="0" type="button"
    style="left:31.8%;top:45.68%;width:15.2%;height:2.55%" aria-label="送出第一關密碼"></button>

  <input class="hot-input" data-i="1" type="password" inputmode="numeric" maxlength="8"
    style="left:53.3%;top:45.72%;width:24.8%;height:2.5%" aria-label="第二關通關密碼">
  <button class="hot-btn" data-i="1" type="button"
    style="left:78.4%;top:45.68%;width:15.2%;height:2.55%" aria-label="送出第二關密碼"></button>

  <input class="hot-input" data-i="2" type="password" inputmode="numeric" maxlength="8"
    style="left:6.5%;top:73.84%;width:24.8%;height:2.5%" aria-label="第三關通關密碼">
  <button class="hot-btn" data-i="2" type="button"
    style="left:31.8%;top:73.8%;width:15.2%;height:2.55%" aria-label="送出第三關密碼"></button>

  <input class="hot-input" data-i="3" type="password" inputmode="numeric" maxlength="8"
    style="left:53.3%;top:73.84%;width:24.8%;height:2.5%" aria-label="第四關通關密碼">
  <button class="hot-btn" data-i="3" type="button"
    style="left:78.4%;top:73.8%;width:15.2%;height:2.55%" aria-label="送出第四關密碼"></button>

  <img class="stamp" data-stamp="0" src="0711c-stamp-1.png?v=20260614e"
    style="left:26.38%;top:37.97%;width:28.4%" alt="第一關通關成功">
  <img class="stamp" data-stamp="1" src="0711c-stamp-2.png?v=20260614e"
    style="left:73.36%;top:37.97%;width:28.4%" alt="第二關通關成功">
  <img class="stamp" data-stamp="2" src="0711c-stamp-3.png?v=20260614e"
    style="left:26.66%;top:65.95%;width:28.4%" alt="第三關通關成功">
  <img class="stamp" data-stamp="3" src="0711c-stamp-4.png?v=20260614e"
    style="left:73.08%;top:65.89%;width:28.4%" alt="第四關通關成功">

  <section class="reward-panel" id="rewardPanel" aria-live="polite">
    <div class="reward-title" id="rewardTitle"></div>
<div class="reward-note">請出示此畫面交付各關關主於活動護照上標註即可領獎</div>
  </section>

  <button class="hot-btn" id="records" type="button"
    style="left:11%;top:91.85%;width:38%;height:4.2%" aria-label="查看闖關紀錄"></button>
  <button class="hot-btn" id="reset" type="button"
    style="left:51%;top:91.85%;width:38%;height:4.2%" aria-label="清除闖關紀錄"></button>

  <div class="error-screen" id="errorScreen">
    <div>
      <h2>圖片載入失敗</h2>
      <p>請確認 0711c.html、0711c-bg.png 與四張印章圖片已上傳到同一個資料夾。</p>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  var PASSWORDS = ["1234","2468","3456","4567"];
  var REWARD_THRESHOLD = 2;
  var STORAGE_KEY = "allInZoo0711cV2";
  var state = [false,false,false,false];

  var inputs = Array.prototype.slice.call(document.querySelectorAll(".hot-input"));
  var buttons = Array.prototype.slice.call(document.querySelectorAll(".hot-btn[data-i]"));
  var stamps = Array.prototype.slice.call(document.querySelectorAll(".stamp"));
  var rewardPanel = document.getElementById("rewardPanel");
  var rewardTitle = document.getElementById("rewardTitle");
  var toast = document.getElementById("toast");
  var bg = document.getElementById("background");
  var errorScreen = document.getElementById("errorScreen");

  try{
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(saved) && saved.length === 4){
      state = saved.map(function(v){ return !!v; });
    }
  }catch(e){}

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function showToast(message){
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function(){ toast.classList.remove("show"); }, 1900);
  }

  function render(animateIndex){
    stamps.forEach(function(stamp,i){
      if(state[i]){
        if(i === animateIndex){
          stamp.classList.remove("show");
          void stamp.offsetWidth;
        }
        stamp.classList.add("show");
      }else{
        stamp.classList.remove("show");
      }
      inputs[i].disabled = state[i];
      inputs[i].type = "password";
      inputs[i].value = "";
    });

    var n = state.filter(Boolean).length;
    rewardPanel.classList.toggle("ready", n >= REWARD_THRESHOLD);
    rewardTitle.classList.toggle("master", n === 4);

    if(n === 4){
      rewardTitle.textContent = "All in Zoo 全通關-闖關達人";
    }else if(n >= REWARD_THRESHOLD){
      rewardTitle.textContent = "完成" + n + "關 可領取闖關禮";
    }else{
      rewardTitle.textContent = "";
    }
  }

  function submit(i){
    if(state[i]){
      showToast("此關已完成");
      return;
    }
    if(inputs[i].value.trim() === PASSWORDS[i]){
      state[i] = true;
      save();
      render(i);
      confetti(state.filter(Boolean).length >= REWARD_THRESHOLD ? 150 : 75);
      if(navigator.vibrate){ navigator.vibrate([50,30,90]); }
      showToast(state.filter(Boolean).length >= REWARD_THRESHOLD
        ? "恭喜！請與關主領取闖關禮"
        : "通關成功！");
    }else{
      showToast("密碼不正確，請再試一次");
      inputs[i].focus();
      inputs[i].select();
    }
  }

  buttons.forEach(function(btn){
    btn.addEventListener("click",function(){
      submit(Number(btn.getAttribute("data-i")));
    });
  });

  inputs.forEach(function(input,i){
    input.addEventListener("keydown",function(e){
      if(e.key === "Enter"){
        e.preventDefault();
        submit(i);
      }
    });
  });

  document.getElementById("records").addEventListener("click",function(){
    var done = state.map(function(v,i){ return v ? "第"+(i+1)+"關" : null; }).filter(Boolean);
    showToast(done.length ? "已完成："+done.join("、") : "目前尚未完成任何關卡");
  });

  document.getElementById("reset").addEventListener("click",function(){
    if(window.confirm("確定要清除所有集章紀錄並重新開始嗎？")){
      state = [false,false,false,false];
      save();
      render(-1);
      showToast("已清除集章紀錄");
    }
  });

  bg.addEventListener("error",function(){ errorScreen.classList.add("show"); });
  stamps.forEach(function(img){
    img.addEventListener("error",function(){
      console.error("印章圖片載入失敗：", img.getAttribute("src"));
    });
  });

  var canvas = document.getElementById("fx");
  var ctx = canvas.getContext("2d");
  var pieces = [];
  var raf = null;

  function resizeCanvas(){
    var ratio = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * ratio;
    canvas.height = window.innerHeight * ratio;
    ctx.setTransform(ratio,0,0,ratio,0,0);
  }
  window.addEventListener("resize",resizeCanvas);
  resizeCanvas();

  function confetti(amount){
    var colors = ["#ef8c22","#f1c13d","#63a43a","#2da5a0","#f05d64"];
    for(var i=0;i<amount;i++){
      pieces.push({
        x:window.innerWidth/2+(Math.random()-.5)*120,
        y:window.innerHeight*.38,
        vx:(Math.random()-.5)*9,
        vy:-3-Math.random()*7,
        g:.17+Math.random()*.07,
        r:3+Math.random()*5,
        a:Math.random()*Math.PI*2,
        c:colors[i%colors.length],
        life:90+Math.random()*50
      });
    }
    if(!raf){ animate(); }
  }

  function animate(){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    pieces = pieces.filter(function(p){ return p.life-- > 0; });
    pieces.forEach(function(p){
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.a += .12;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore();
    });
    raf = pieces.length ? requestAnimationFrame(animate) : null;
  }

  render(-1);
})();
</script>
</body>
</html>
